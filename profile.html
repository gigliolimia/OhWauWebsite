<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile · Oh Wau, Patitas!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Allura&family=Bitter:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="profile" class="paw-boot">
    <header class="site-header"></header>
    <main>
      <section class="page-hero">
        <h1 data-i18n="accountHero">Your Oh Wau account</h1>
        <p data-i18n="accountLead">Save pets, pick how you pay, and book a visit for a specific pup.</p>
        <button class="btn ghost" type="button" data-logout data-i18n="logOut">Log out</button>
      </section>
      <section class="section">
        <div class="wrap profile-grid">
          <form class="profile-card" data-profile-form>
            <h2 data-i18n="navProfile">Profile</h2>
            <img class="avatar-preview" data-avatar alt="" hidden />
            <label><span data-i18n="displayName">Your name</span> <input name="name" required /></label>
            <label><span data-i18n="username">Username</span> <input name="username" required /></label>
            <label><span data-i18n="email">Email</span> <input name="email" type="email" readonly /></label>
            <label><span data-i18n="phone">Phone</span> <input name="phone" type="tel" /></label>
            <label><span data-i18n="profilePhoto">Profile photo</span> <input name="photo" type="file" accept="image/*" /></label>
            <button class="btn" type="submit" data-i18n="saveProfile">Save profile</button>
            <p class="account-note" data-profile-note></p>
          </form>
          <form class="profile-card" data-pay-form>
            <h2 data-i18n="payMethod">Payment method</h2>
            <div class="pay-choices">
              <label class="check"><input type="radio" name="method" value="card" /> <span data-i18n="payCard">Card</span></label>
              <label class="check"><input type="radio" name="method" value="gift" /> <span data-i18n="payGift">Gift card</span></label>
              <label class="check"><input type="radio" name="method" value="cash" checked /> <span data-i18n="payCash">Cash</span></label>
            </div>
            <label><span data-i18n="cardLast4">Last 4 digits</span> <input name="last4" inputmode="numeric" maxlength="4" autocomplete="off" /></label>
            <label class="check"><input type="checkbox" name="reminders" checked /> <span data-i18n="remindersOn">Email me reminders for upcoming appointments</span></label>
            <button class="btn" type="submit" data-i18n="saveProfile">Save profile</button>
            <p class="account-note" data-pay-note></p>
          </form>
        </div>
      </section>
      <section class="section mist">
        <div class="wrap">
          <h2 data-i18n="yourPets">Your pets</h2>
          <div class="pet-grid" data-pets></div>
          <form class="profile-card" data-pet-form style="margin-top: 1.2rem">
            <h3 data-i18n="addPet">Add a pet</h3>
            <label><span data-i18n="dogName">Dog’s name</span> <input name="name" required /></label>
            <label><span data-i18n="petBreed">Breed</span> <input name="breed" /></label>
            <label><span data-i18n="petAge">Age</span> <input name="age" /></label>
            <label><span data-i18n="birthday">Birthday</span> <input name="birthday" type="date" /></label>
            <label><span data-i18n="petBio">Profile description</span> <textarea name="bio"></textarea></label>
            <label><span data-i18n="petPhoto">Pet photo</span> <input name="photo" type="file" accept="image/*" /></label>
            <button class="btn" type="submit" data-i18n="addPet">Add a pet</button>
          </form>
        </div>
      </section>
      <section class="section">
        <div class="wrap profile-grid">
          <form class="profile-card" data-pet-book-form>
            <h2 data-i18n="schedulePet">Schedule a service</h2>
            <label><span data-i18n="choosePet">Choose a pet</span> <select name="petId" required></select></label>
            <label><span data-i18n="offering">Offering</span>
              <select name="offering" required>
                <option value="offeringGrooming" data-i18n="offeringGrooming">Mobile grooming</option>
                <option value="offeringDaycare" data-i18n="offeringDaycare">Pet day care</option>
                <option value="offeringSitting" data-i18n="offeringSitting">Pet sitting</option>
                <option value="offeringBoarding" data-i18n="offeringBoarding">Pet boarding</option>
              </select>
            </label>
            <label><span data-i18n="preferredDate">Preferred date</span> <input name="date" type="date" required /></label>
            <label><span data-i18n="preferredTime">Preferred time</span> <input name="time" type="time" required /></label>
            <button class="btn" type="submit" data-i18n="sendRequest">Send request</button>
            <p class="account-note" data-book-note></p>
          </form>
          <div class="profile-card">
            <h2 data-i18n="upcomingReminders">Upcoming</h2>
            <div data-my-bookings></div>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer stacked">
      <div class="footer-inner">
        <a class="footer-brand" href="index.html">
          <img src="images/logo.png?v=paw2" alt="Oh Wau, Patitas!" />
          <span>
            <em>Oh Wau, Patitas!</em>
            <small>PET CENTER · FLORIDA</small>
          </span>
        </a>
        <div class="contact-tiles">
          <a href="sms:9549136161"><strong data-i18n="callText">Call / text</strong><span>(954) 913-6161</span></a>
          <a href="mailto:gmilallc1@gmail.com"><strong data-i18n="emailUs">Email</strong><span>gmilallc1@gmail.com</span></a>
          <a href="https://wa.me/19549136161"><strong data-i18n="whatsapp">WhatsApp</strong><span data-i18n="messageUs">Message us</span></a>
        </div>
        <p class="hablamos" data-i18n="hablamos">Hablamos Español!</p>
      </div>
    </footer>
    <script src="js/salon.js"></script>
  </body>
</html>
